[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "aegiscyber-ai"
version = "1.0.0"
description = "AI-powered cybersecurity research, reconnaissance, OSINT, and security-testing assistant"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "AegisCyber AI Team"}
]

dependencies = [
    "PySide6>=6.7.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "aiohttp>=3.9.0",
    "aiosqlite>=0.20.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
    "pyyaml>=6.0.1",
    "cryptography>=42.0.0",
    "httpx>=0.27.0",
    "torch>=2.3.0",
    "transformers>=4.41.0",
    "peft>=0.11.0",
    "sentence-transformers>=3.0.0",
    "networkx>=3.3",
    "rich>=13.7.0",
    "python-dateutil>=2.9.0",
    "orjson>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
aegiscyber = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
