name: dnsx
description: Fast and multi-purpose DNS toolkit
category:
  - DNS
  - SUBDOMAIN_DISCOVERY
binary: dnsx
execution_backend:
  - wsl2
  - docker
capabilities:
  - dns_resolution
  - dns_bruteforce
  - wildcard_detection
input_types:
  - domain
  - subdomain_list
output_types:
  - dns_records
  - ip_addresses
danger_level: SAFE
parser: dns
default_timeout: 120
requires_root: false
examples:
  - description: Comprehensive DNS record recon
    command: dnsx -d {target} -recon -silent
    expected_output: Resolved DNS records
    risk_level: SAFE
arguments:
  - name: domain
    flag: -d
    description: Target domain
    arg_type: domain
    required: true
  - name: recon
    flag: -recon
    description: Query multiple DNS record types
    arg_type: boolean
    required: false
  - name: silent
    flag: -silent
    description: Silent mode
    arg_type: boolean
    required: false
