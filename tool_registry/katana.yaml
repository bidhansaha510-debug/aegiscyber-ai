name: katana
description: Next-gen crawling and spidering framework by ProjectDiscovery
category:
- WEB_RECON
- SUBDOMAIN_DISCOVERY
binary: katana
execution_backend:
- wsl2
- docker
documentation: https://github.com/projectdiscovery/katana
capabilities:
- web_crawling
- endpoint_discovery
- js_parsing
- form_discovery
input_types:
- url
- domain
output_types:
- urls
- endpoints
- forms
arguments:
- name: url
  flag: -u
  description: Target URL
  arg_type: string
  required: true
- name: depth
  flag: -d
  description: Crawl depth
  arg_type: integer
  required: false
  default: 3
- name: js_crawl
  flag: -jc
  description: JS crawling
  arg_type: boolean
  required: false
- name: silent
  flag: -silent
  description: Silent output
  arg_type: boolean
  required: false
required_arguments:
- url
optional_arguments:
- depth
- js_crawl
danger_level: SAFE
allowed_modes:
- passive
- active
examples:
- description: Deep crawl
  command: katana -u {target} -d 3 -jc -silent
  expected_output: Discovered URLs
  risk_level: SAFE
expected_output_patterns: []
error_patterns: []
parser: generic
default_timeout: 0
requires_root: false
