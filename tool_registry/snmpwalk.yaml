name: snmpwalk
description: SNMP MIB tree walker for device enumeration
category:
- SERVICE_ENUMERATION
- NETWORK_RECON
binary: snmpwalk
execution_backend:
- wsl2
- docker
documentation: http://www.net-snmp.org/
capabilities:
- snmp_enumeration
- device_info
- network_discovery
input_types:
- ip_address
- hostname
output_types:
- snmp_data
- device_info
arguments:
- name: version
  flag: -v
  description: SNMP version (1, 2c, 3)
  arg_type: string
  required: true
  default: 2c
- name: community
  flag: -c
  description: Community string
  arg_type: string
  required: false
  default: public
required_arguments:
- version
optional_arguments:
- community
danger_level: LOW_RISK
allowed_modes:
- active
examples:
- description: SNMP walk
  command: snmpwalk -v 2c -c public {target}
  expected_output: SNMP data
  risk_level: LOW_RISK
expected_output_patterns: []
error_patterns:
- name: timeout
  pattern: Timeout
  description: No SNMP response
parser: generic
default_timeout: 0
requires_root: false
