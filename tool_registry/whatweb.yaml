name: whatweb
description: Next generation web scanner that identifies websites including CMS, blogging platforms, analytics packages, JavaScript libraries, web servers, and embedded devices
category:
  - WEB_RECON
  - SERVICE_ENUMERATION
binary: whatweb
execution_backend:
  - wsl2
  - docker
documentation: https://github.com/urbanadventurer/WhatWeb
capabilities:
  - technology_detection
  - cms_detection
  - web_fingerprinting
  - header_analysis
input_types:
  - url
  - domain
  - ip_address
output_types:
  - technologies
  - cms_info
  - server_info
arguments:
  - name: aggression
    flag: "-a"
    description: Aggression level (1=stealthy, 3=aggressive, 4=heavy)
    arg_type: integer
    required: false
    default: 1
  - name: verbose
    flag: "-v"
    description: Verbose output
    arg_type: boolean
    required: false
  - name: log_json
    flag: "--log-json"
    description: Log output in JSON format
    arg_type: file_path
    required: false
  - name: user_agent
    flag: "-U"
    description: Custom user agent
    arg_type: string
    required: false
required_arguments: []
optional_arguments:
  - aggression
  - verbose
danger_level: SAFE
allowed_modes:
  - passive
  - active
examples:
  - description: Identify technologies on a website
    command: "whatweb -a 3 -v {target}"
    expected_output: Technology stack and version information
    risk_level: SAFE
expected_output_patterns:
  - name: technology
    pattern: '(\S+)\[(.+?)\]'
    description: Matches technology identifications
error_patterns:
  - name: connection_error
    pattern: "ERROR Opening"
    description: Cannot connect to target
parser: generic
default_timeout: 0
requires_root: false
